name: publish

on:
  push:
    branches:
      - 'release/*'

jobs:
  publish:
    # need to ensure this only runs on the main repo, not forks, to avoid leaking the NPM_TOKEN secret (hopefully)
    if: github.event_name == 'push' && github.repository == 'danieljohnbyns/fb-chat-mcp'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          BRANCH_VERSION="${GITHUB_REF_NAME#release/v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          echo "branch_version=$BRANCH_VERSION" >> "$GITHUB_OUTPUT"
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify version matches branch
        run: |
          if [ "${{ steps.version.outputs.branch_version }}" != "${{ steps.version.outputs.version }}" ]; then
            echo "package.json version (${{ steps.version.outputs.version }}) does not match branch ${{ github.ref_name }}" >&2
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun run test

      - name: Check if version is publishable
        id: check
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          PKG_NAME="$(node -p "require('./package.json').name")"
          PUBLISHED="$(npm view "$PKG_NAME" versions --json 2>/dev/null || echo '[]')"
          DECISION="$(node -e '
            const v = process.argv[1];
            let published = [];
            try {
              published = JSON.parse(process.argv[2]);
            } catch {}
            console.log(published.includes(v) ? "skip" : "publish");
          ' "$VERSION" "$PUBLISHED")"
          echo "decision=$DECISION" >> "$GITHUB_OUTPUT"

      - name: Publish to npm
        if: steps.check.outputs.decision == 'publish'
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            delete pkg.private;
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, "\t") + "\n");
          '
          echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" > "$HOME/.npmrc"
          npm publish --access public

      - name: Skip
        if: steps.check.outputs.decision == 'skip'
        run: echo "version ${{ steps.version.outputs.version }} already published; nothing to do"
